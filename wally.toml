[package]
name = "morgann1/promise-luau"
authors = ["morgann1", "evaera (Eryn L. K)"]
description = "Promise implementation for Roblox"
version = "4.1.0"
license = "MIT"
registry = "https://github.com/UpliftGames/wally-index"
realm = "shared"
# Wally also drops dotfiles, wally.lock, and everything in .gitignore.
exclude = [
	"**/*.spec.luau",
	"docs",
	"scripts",
	"moonwave.toml",
	"project.luau",
	"rokit.toml",
	"selene.toml",
	"tests.project.json",
]

[dev-dependencies]
Jest = "roblox/jest@3.20.1"
JestGlobals = "roblox/jest-globals@3.20.1"
